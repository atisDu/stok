# stokd configuration. Values shown are defaults unless noted.
# Verify every feed URL on your server with:   ./build/stokd --probe

[general]
data_dir = data                 # ref/, journal/, baseline/ live under here
rules_file = config/rules.tsv
log_level = info                # debug | info | warn | error
# log_file = data/stokd.log     # default: stderr

[threads]
# Pin the latency-critical threads to dedicated cores (ideally isolated with
# isolcpus=/nohz_full= on the kernel command line). -1 = unpinned.
net_cpu = -1
engine_cpu = -1
market_cpu = -1
rt_priority = 0                 # >0 = SCHED_FIFO for pinned threads (needs CAP_SYS_NICE)
mlock = false                   # lock memory to avoid page faults (needs CAP_IPC_LOCK)

[net]
# SEC requires "Company/Name contact@email" or it answers 403. REQUIRED.
user_agent = stok-research your.name@example.com
verify_tls = true
busy_poll = false               # true = spin on epoll (lowest wake-up latency, burns a core)
connect_timeout_ms = 3000
io_timeout_ms = 8000
default_max_rps = 4
fetch_exhibits = true           # fetch EX-99 press releases attached to 8-K/6-K
exhibit_max_shares = 500e6      # only for issuers below this share count
stats_interval_s = 60

# Per-host request budgets shared by all feeds (token bucket).
# SEC fair access: max 10 req/s per client across all SEC hosts. Keep margin.
[host www.sec.gov]
max_rps = 8

[host www.globenewswire.com]
max_rps = 4

[host www.prnewswire.com]
max_rps = 4

[host feed.businesswire.com]
max_rps = 4

[host www.nasdaqtrader.com]
max_rps = 2

# ---------------------------------------------------------------------------
# Feeds. interval_ms = effective poll period; lanes = warm connections
# polling in staggered phases (each lane polls every interval_ms * lanes).
# kind = edgar | rss | halts
# ---------------------------------------------------------------------------

# SEC EDGAR "latest filings" (official, free, updated as filings are accepted).
# The type filter is a prefix match.
[feed edgar_8k]
kind = edgar
url = https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&start=0&count=100&output=atom
interval_ms = 500
lanes = 2

[feed edgar_6k]
kind = edgar
url = https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=6-K&company=&dateb=&owner=include&start=0&count=100&output=atom
interval_ms = 2000
lanes = 1

[feed edgar_424b]
kind = edgar
url = https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=424B&company=&dateb=&owner=include&start=0&count=100&output=atom
interval_ms = 3000
lanes = 1

[feed edgar_s1]
kind = edgar
url = https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-1&company=&dateb=&owner=include&start=0&count=40&output=atom
interval_ms = 10000
lanes = 1

[feed edgar_s3]
kind = edgar
url = https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-3&company=&dateb=&owner=include&start=0&count=40&output=atom
interval_ms = 10000
lanes = 1

[feed edgar_effect]
kind = edgar
url = https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=EFFECT&company=&dateb=&owner=include&start=0&count=40&output=atom
interval_ms = 10000
lanes = 1

# Press-release wires (public RSS). Most small-cap press releases go out on
# these. Their RSS can lag their paid machine-readable feeds; stokd --probe and
# the per-source "first/behind" stats tell you which is fastest in practice.
[feed globenewswire]
kind = rss
url = https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies
interval_ms = 1000
lanes = 2

[feed prnewswire]
kind = rss
url = https://www.prnewswire.com/rss/news-releases-list.rss
interval_ms = 1000
lanes = 2

[feed businesswire]
kind = rss
url = https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeGVtRWA==
interval_ms = 1000
lanes = 2

# Accesswire and Newsfile carry many micro-cap releases. Copy their current
# RSS URLs from their websites, then enable.
[feed accesswire]
enabled = false
kind = rss
url = https://www.accesswire.com/rss/SET-ME
interval_ms = 1000
lanes = 2

[feed newsfile]
enabled = false
kind = rss
url = https://www.newsfilecorp.com/rss/SET-ME
interval_ms = 1000
lanes = 2

# Nasdaq Trader halts (official; covers all US-listed securities).
[feed nasdaq_halts]
kind = halts
url = https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts
interval_ms = 1000
lanes = 1

# ---------------------------------------------------------------------------

[universe]
min_price = 0.50
max_price = 10
max_market_cap = 500e6
listed_only = true              # Nasdaq / NYSE / NYSE American / Arca / Cboe only (no OTC)
allow_unknown_price = true      # keep tickers with no price yet (e.g. no market feed)

[signal]
watch_score = 55                # news score needed to start watching a ticker
high_score = 75
alert_move_pct = 8              # ALERT: up at least this % since the news...
alert_rvol = 5                  # ...with this relative volume (ignored if no baseline yet)...
alert_dollar_volume = 300000    # ...and this much traded since the news...
alert_max_spread_pct = 3        # ...with a spread no wider than this (needs quotes; 0 = off)
high_max_shares = 30e6          # HIGH: shares outstanding at most this (float proxy)
high_require_above_vwap = true
watch_window_min = 90
cooldown_min = 30
push_watch = false              # also push WATCH-tier signals to Telegram/stdout
halt_alerts = watchlist         # none | watchlist | universe
eval_interval_us = 2000         # watchlist re-evaluation cadence
busy_poll = false
outcome_horizons_s = 60, 300, 900, 1800, 3600

[movers]
enabled = true                  # big movers with no qualifying news
move_pct = 25
rvol = 8
dollar_volume = 1e6
scan_ms = 1000

[dilution]
offering_window_days = 10
s1_window_days = 180
shelf_window_days = 1095
proxy_window_days = 90

[paper]
# Local paper trading from ALERT/HIGH signals, using live quotes from [market].
# Writes data/journal/<day>/trades.jsonl; summarize with stok-report.
enabled = false
tiers = alert, high
latency_ms = 250                # signal -> simulated order arrival
slippage_bps = 30               # adverse slippage on every fill
position_usd = 1000
max_open = 3
max_daily_loss_usd = 300        # no new entries after this realized loss (per day)
stop_loss_pct = 8
take_profit_pct = 20
trail_activate_pct = 10
trail_pct = 8
max_hold_min = 30
flat_by = 15:55                 # ET
entry_timeout_s = 10
max_chase_pct = 5               # skip if price ran this far past the signal during latency
commission_per_share = 0
commission_min = 0

[market]
# none      news-only (WATCH signals, halts from RSS)
# moldudp64 Nasdaq TotalView-ITCH 5.0 over MoldUDP64 multicast (needs a
#           Nasdaq data subscription and connectivity)
# itch_file replay an ITCH 5.0 file (e.g. Nasdaq's sample files) for testing
# bridge    UDP text lines "T SYM PRICE SIZE [EPOCH_NS]" from any other source
source = none
itch_file = data/itch/01302019.NASDAQ_ITCH50.gz
replay_speed = 1.0
# session_date = 2019-01-30     # default: from the ITCH file name, else today
mold_group =
mold_port = 0
mold_iface =
mold_rerequest =                # ip:port of the re-request server (gap recovery; empty = off)
mold_gap_timeout_ms = 250
bridge_bind = 127.0.0.1
bridge_port = 7777
order_capacity = 4194304
track_quotes = true             # build price ladders for best bid/ask (ITCH)
# Recording for stok-backtest (news is always journaled in full):
record_itch = false             # live ITCH -> data/itch/MMDDYYYY.NASDAQ_ITCH50.gz (several GB/day)
record_tape = true              # bridge input -> data/tape/YYYY-MM-DD.tape
write_baseline = true

[alerts]
stdout = true
# Secrets: prefer environment variables STOK_TELEGRAM_TOKEN / STOK_TELEGRAM_CHAT_ID
# (or telegram_token = env:MY_VAR).
telegram_token =
telegram_chat_id =
telegram_min_tier = alert       # watch | alert | high
telegram_halts = true
telegram_movers = true
# udp_target = 127.0.0.1:7788   # one JSON datagram per signal (dashboards)
keepalive_ping_s = 25

[queues]
news = 4096
market_events = 16384
alerts = 1024
journal = 4096
